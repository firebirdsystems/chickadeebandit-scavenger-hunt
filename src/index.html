  <style>

    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 8px; }
    .btn {

    .back { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; font-size: .82rem; font-weight: 700; padding: 0; margin-bottom: 8px; }

      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);

    .pill {
      display: inline-flex; align-items: center; min-height: 20px; padding: 1px 9px;

    .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 14px; }
    .task-title { font-weight: 750; font-size: .95rem; }
    .task-points { color: var(--muted); font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .sealed { color: var(--muted); font-size: .82rem; margin-top: 8px; }
    .submit-row { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; align-items: center; }
    .submit-row input[type="text"] { flex: 1; min-width: 140px; }
    .finds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
    .find { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); }
    .find img { width: 100%; height: 110px; object-fit: cover; display: block; }
    .find .find-meta { padding: 6px 8px; font-size: .76rem; }
    .find .who { font-weight: 800; }
    .award-row { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
    .award-row input { width: 54px; padding: 3px 6px; font-size: .78rem; }
    .score-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .score-rank { font-weight: 800; width: 24px; text-align: center; }
    .score-name { flex: 1; font-weight: 700; }
    .score-pts { font-weight: 800; }
    .empty { color: var(--muted); text-align: center; padding: 30px 16px; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }

    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 2px 8px; }
    input, textarea {
      border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text); width: 100%;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--surface); border-radius: 14px; padding: 22px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 92vh; overflow-y: auto; }
    .modal h2 { font-size: 1.05rem; margin-bottom: 16px; }
    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 5px; }
    .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
    .modal h2 + .muted { margin-bottom: 12px; }
    .share-row { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--border); }
    .share-url { width: 100%; font-size: .8rem; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg, transparent); color: inherit; }
    .share-row-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .share-create { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    .share-create select { padding: 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: inherit; font: inherit; font-size: .85rem; }
    #share-password { width: 100%; margin-top: 10px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: inherit; font: inherit; font-size: .85rem; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/scavenger-hunt/">
</head>
<body>
<div class="app">
  <div id="root" class="empty">Loading…</div>
</div>

<script type="module">
import { esc, isAdult, hubConfirm, hubAlert, createFilesHelper, createShareHelper, searchMatch, glyph, chickadee, activeShareLinks, SHARE_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS } from "/hub-sdk.js";
import {
  isOrganizer, statusLabel, visibleHunts, huntTasks, submissionFor,
  foundCount, awardBySubmission, scoreboard, searchableFields, tilePhotoId, huntVisibility, misfiledHunts,
  failureLine, photoUploadLine, findRefusedLine,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const files = createFilesHelper(window.__FILES_URL ?? "");
const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
const EVENTS = window.__EVENTS_URL ?? "";

async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // The status change is already written; a failed publish is not fatal.
  }
}

let members = [];
let memberMap = new Map();
let me = null;
let hunts = [];
let searchQ = "";       // in-app search (see logic.js searchableFields)
let tasks = [];
let submissions = []; // hub-filtered: mine + revealed hunts
let awards = [];
let openHuntId = null;
let error = "";
let modalEl = null;
let shareLinks = [];
let shareEntitled = false;

function nowIso() { return new Date().toISOString(); }
function memberName(id) { return memberMap.get(id)?.name ?? "Someone"; }

/* ── DB helper ─────────────────────────────────────────────────────────────── */
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (json?.error) {
    // The hub answered, and said no. Told apart from a request that never
    // got an answer, where nothing is known about what was written.
    // Its status (and `code`) pick the line shown; the text stays in the console.
    const refusal = new Error(json.error);
    refusal.refused = true;
    refusal.status = res.status;
    if (typeof json.code === "string") refusal.code = json.code;
    throw refusal;
  }
  // No readable answer: nothing is known about what was written.
  if (!res.ok || !json || typeof json !== "object") throw Object.assign(new Error("Couldn’t reach the hub. Try again."), { status: res.status });
  return json;
}

/* ── Loading ───────────────────────────────────────────────────────────────── */
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
    ];
  } else {
    // Throws when the members cannot be read: refresh() treats it like any
    // other failed read, so nobody is drawn as "Unknown" on a guess.
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    const json = await res.json().catch(() => null);
    if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error("Couldn’t reach the hub. Try again.");
    // A 200 can still name a key the hub failed to read: that is a failed read too.
    if (Array.isArray(json.$errors) && json.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
    members = json["family.members"] ?? [];
  }
  memberMap = new Map(members.map((m) => [m.id, m]));
  me = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

async function loadData() {
  if (!DB) {
    hunts = [{ id: "h1", title: "Backyard Safari", status: "open", visibility: "everyone", created_by: "demo-1", created_at: nowIso() }];
    tasks = [
      { id: "t1", hunt_id: "h1", title: "Something older than Dad", points: 2, sort_order: 0, created_by: "demo-1", created_at: nowIso() },
      { id: "t2", hunt_id: "h1", title: "A bug (photo only, be kind)", points: 1, sort_order: 1, created_by: "demo-1", created_at: nowIso() },
    ];
    submissions = [];
    awards = [];
    return;
  }
  const h = await db("SELECT id, title, status, visibility, created_by, created_at FROM app_scavenger_hunt__hunts ORDER BY created_at DESC LIMIT 50");
  hunts = h.rows ?? [];
  // Best effort: a failure leaves the hunt as it was, to be tried next load.
  for (const hunt of misfiledHunts(hunts, HUB_MEMBER)) {
    const visibility = huntVisibility(hunt.status);
    try {
      // Only while the hunt is still at the stage this was worked out for.
      // Another tab can start a draft between the read and this write, and
      // "private", right for the draft, would then hide a hunt that is on.
      const { changed } = await db("UPDATE app_scavenger_hunt__hunts SET visibility=? WHERE id=? AND status=?", [visibility, hunt.id, hunt.status]);
      if (changed !== 0) hunt.visibility = visibility;
    } catch { /* left as stored; the organizer sees it either way */ }
  }
  ({ tasks, submissions, awards } = await loadChildrenFor(hunts));
}

/**
 * Tasks, submissions and awards for exactly the hunts we loaded.
 *
 * These used to be blind `LIMIT 600` / `LIMIT 1500` reads with NO `ORDER BY`,
 * which is an arbitrary slice once the table outgrows the number — the hunt on
 * screen could render with some of its tasks missing and a scoreboard that
 * silently under-counts, with no error anywhere. Scoping to the 50 loaded hunts
 * bounds the read by the same window the UI actually shows, instead of by a
 * number that ages out. (Question of the Day had the identical defect; this is
 * the same fix.)
 */
async function loadChildrenFor(huntList) {
  if (!huntList.length) return { tasks: [], submissions: [], awards: [] };
  const ids = huntList.map((h) => h.id);
  const holes = ids.map(() => "?").join(",");
  const [t, s, a] = await Promise.all([
    db(`SELECT id, hunt_id, title, points, sort_order, created_by, created_at FROM app_scavenger_hunt__tasks WHERE hunt_id IN (${holes})`, ids),
    // The hub's sealed_until policy filters this to my own submissions plus
    // everything on hunts that have closed — no client-side gating needed.
    db(`SELECT id, hunt_id, task_id, member_id, photo_file_id, thumb_file_id, caption, created_at FROM app_scavenger_hunt__submissions WHERE hunt_id IN (${holes})`, ids),
    db(`SELECT id, hunt_id, submission_id, points_awarded, awarded_by, created_at FROM app_scavenger_hunt__awards WHERE hunt_id IN (${holes})`, ids),
  ]);
  return { tasks: t.rows ?? [], submissions: s.rows ?? [], awards: a.rows ?? [] };
}

// The first load failed: the hunts are unknown, not absent. A later re-read
// that fails keeps what is on screen and says so inline.
let loaded = false;
let loadFailed = false;

async function refresh() {
  error = "";
  try {
    await Promise.all([loadMembers(), loadData()]);
    if (openHuntId && !hunts.some((h) => h.id === openHuntId)) openHuntId = null;
    loaded = true; loadFailed = false;
  } catch (e) { console.error(e); if (loaded) error = "Couldn’t load the hunts."; else loadFailed = true; }
  render();
}

function showError(msg) { error = msg; render(); }
// Wording this app wrote for the reader is marked where it is thrown; any
// other failure is said by failureLine from its status, never the hub's text.
function userError(msg) { return Object.assign(new Error(msg), { forUser: true }); }

/* ── Mutations ─────────────────────────────────────────────────────────────── */
async function createHunt(title) {
  const row = { id: crypto.randomUUID(), title, status: "draft", visibility: huntVisibility("draft"), created_by: me.id, created_at: nowIso() };
  // Not drawn until the hub has it: a save that fails throws to the form,
  // which says so and stays open as typed (see submitModalForm).
  await db("INSERT INTO app_scavenger_hunt__hunts (id, title, status, visibility, created_by, created_at) VALUES (?,?,?,?,?,?)",
    [row.id, row.title, row.status, row.visibility, row.created_by, row.created_at]);
  hunts = [row, ...hunts];
  openHuntId = row.id;
  closeModal(); render();
}

async function setHuntStatus(id, status) {
  const prev = hunts.find((h) => h.id === id);
  if (!prev) return;
  // A draft is the organizer's alone; starting the hunt is what shows it, and
  // its list, to everyone (see huntVisibility).
  const visibility = huntVisibility(status);
  // By id, here and in the undo: the list can gain or lose a hunt while this
  // is out, and a remembered position then names a different one.
  hunts = hunts.map((h) => (h.id === id ? { ...prev, status, visibility } : h));
  // Until the reveal's re-read lands the page holds only this member's own
  // finds: it says so, and awards wait, since the re-read replaces them.
  if (status === "closed") revealing = id;
  render();
  try {
    const { changed } = await db("UPDATE app_scavenger_hunt__hunts SET status=?, visibility=? WHERE id=?", [status, visibility, id]);
    // Only the organizer may write a hunt; the hub answers anyone else, or a
    // hunt already deleted, with zero rows rather than an error.
    if (changed === 0) throw userError("This hunt can no longer be changed.");
    if (status === "closed") {
      await refresh(); // sealed submissions just released
      // The reveal is on the page now; the announcement below is not part of it.
      revealing = null;
      render();
    }
    // Real transitions only — re-saving the same status publishes nothing. No
    // task, caption or photo travels: opening is an invitation and closing is
    // the reveal, and both are already household-visible facts.
    if (status !== prev.status && (status === "open" || status === "closed")) {
      await publishEvent(status === "open" ? "hunt.opened" : "hunt.closed", id, {
        title: prev.title,
        organizer_id: prev.created_by,
      });
    }
  } catch (e) { console.error(e); hunts = hunts.map((h) => (h.id === id ? prev : h)); showError(failureLine(e, { action: "update the hunt", thing: "hunt" })); }
  finally {
    if (revealing === id) { revealing = null; render(); }
  }
}
let revealing = null;   // id of the hunt whose reveal is being read

// Ending is the reveal and it cannot be taken back: finds are frozen from then on.
async function closeHunt(id) {
  const ok = await hubConfirm({ message: "End the hunt and reveal everyone's finds?", description: "Nobody can add a find after this, and it can't be reopened.", confirmLabel: "End & reveal" });
  if (ok) await setHuntStatus(id, "closed");
}

/*
 * Proof photos live in hub file storage; the DB row only holds the id. The FK
 * cascade removes the submission rows but knows nothing about R2, so a deleted
 * hunt used to strand every one of its photos — unreachable and still billed.
 *
 * This was fixed once in the client, by collecting the ids from the loaded
 * `submissions` before the delete and sweeping the bytes after. That could
 * never work: submissions are `sealed_until` the hunt CLOSES, so until then the
 * organizer's own client can only see their own — deleting an open hunt (the
 * ordinary abandon case) swept one photo and stranded everyone else's. The
 * paging cap was a second way to miss rows.
 *
 * `manifest.delete_cascades` does it server-side instead: the engine reads
 * `photo_file_id` off the doomed rows (no row policy in its way), deletes the
 * children inside the parent DELETE's transaction, and records the file
 * reclaim in a durable outbox — so it also survives the tab closing mid-delete.
 * Nothing is left for the client to do but the optimistic update.
 */
async function deleteHunt(id) {
  const ok = await hubConfirm({ message: "Delete this hunt?", description: "Tasks, photos, and scores go with it.", confirmLabel: "Delete", destructive: true });
  if (!ok) return;
  const removed = hunts.find((h) => h.id === id);
  const wasOpen = openHuntId === id;
  hunts = hunts.filter((h) => h.id !== id);
  if (wasOpen) openHuntId = null;
  render();
  try {
    const { changed } = await db("DELETE FROM app_scavenger_hunt__hunts WHERE id=?", [id]);
    if (changed === 0) throw userError("This hunt could not be deleted.");
    submissions = submissions.filter((s) => s.hunt_id !== id);
    tasks = tasks.filter((t) => t.hunt_id !== id);
    awards = awards.filter((a) => a.hunt_id !== id);
  }
  catch (e) {
    // Put back the one hunt, not the list as it was: anything added or removed
    // since then stays as it is.
    if (removed && !hunts.some((h) => h.id === id)) hunts = [...hunts, removed];
    if (wasOpen && openHuntId === null) openHuntId = id;
    console.error(e);
    showError(failureLine(e, { action: "delete the hunt", thing: "hunt" }));
  }
}

async function addTask(huntId, title, points) {
  const row = { id: crypto.randomUUID(), hunt_id: huntId, title, points, sort_order: huntTasks(tasks, huntId).length, created_by: me.id, created_at: nowIso() };
  // As in createHunt: drawn, and the form closed, only once the hub has it.
  await db("INSERT INTO app_scavenger_hunt__tasks (id, hunt_id, title, points, sort_order, created_by, created_at) VALUES (?,?,?,?,?,?,?)",
    [row.id, row.hunt_id, row.title, row.points, row.sort_order, row.created_by, row.created_at]);
  tasks = [...tasks, row];
  closeModal(); render();
}

async function deleteTask(id) {
  const removed = tasks.find((t) => t.id === id);
  tasks = tasks.filter((t) => t.id !== id);
  render();
  try {
    // delete_cascades.tasks reclaims the submissions and their photos; see the
    // note above deleteHunt for why the client cannot do this itself.
    const { changed } = await db("DELETE FROM app_scavenger_hunt__tasks WHERE id=?", [id]);
    if (changed === 0) throw userError("This task could not be removed.");
    submissions = submissions.filter((s) => s.task_id !== id);
  }
  catch (e) {
    // The one task back, so a second removal that did go through stays gone.
    if (removed && !tasks.some((t) => t.id === id)) tasks = [...tasks, removed];
    console.error(e);
    showError(failureLine(e, { action: "remove the task", thing: "task" }));
  }
}

async function submitFind(hunt, taskId, file, caption) {
  let fileId = "", thumbId = null;
  if (file) {
    try {
      // The hub keeps a small copy with the photo, which is what the reveal grid draws.
      const up = await files.upload(file, { thumbnail: true });
      fileId = up.id;
      thumbId = up.thumbnailId ?? null;
    } catch (e) { console.error(e); showError(photoUploadLine(e)); return; }
  }
  const row = { id: crypto.randomUUID(), hunt_id: hunt.id, task_id: taskId, member_id: me.id, photo_file_id: fileId, thumb_file_id: thumbId, caption, created_at: nowIso() };
  // Not drawn as sealed until it is: the form stays as it is, "Sealing…", with
  // its photo and caption, so a find that does not land can be sent again
  // without retaking the picture.
  try {
    await db("INSERT INTO app_scavenger_hunt__submissions (id, hunt_id, task_id, member_id, photo_file_id, thumb_file_id, caption, created_at) VALUES (?,?,?,?,?,?,?,?)",
      [row.id, row.hunt_id, row.task_id, row.member_id, row.photo_file_id, row.thumb_file_id, row.caption, row.created_at]);
  } catch (e) {
    // An error is not proof the find is absent. A lost reply is the plain
    // case, and the hub itself answers with an error when the database stalls
    // on a write that may yet land. So the row is looked for either way, and
    // the photo goes only when the hub refused AND the row is confirmed not
    // there: a find that landed with its photo deleted was a broken tile at
    // the reveal that its hunter could not replace (one find per task). An
    // unused photo is the cheaper mistake.
    let saved = null;   // true, false, or null when that could not be asked either
    try {
      saved = ((await db("SELECT id FROM app_scavenger_hunt__submissions WHERE id=?", [row.id])).rows ?? []).length > 0;
    } catch { /* still unknown */ }
    if (!saved) {
      const refused = e?.refused === true && saved === false;
      if (refused && fileId) files.delete(fileId).catch(() => {});
      console.error(e);
      if (!refused) { showError("Couldn't confirm your find was saved. Reload to check before trying again."); return; }
      // A refusal from the hunt's state (it ended, or this task already has
      // your find): read again, so the line says which. The form is kept.
      let reread = {};
      if (e?.status === 403 || e?.status === 409) {
        await refresh();
        if (!error) {
          const now = hunts.find((h) => h.id === hunt.id);
          reread = { huntStatus: now ? now.status : null, alreadySent: !!submissionFor(submissions, taskId, me.id) };
        }
      }
      showError(findRefusedLine(e, reread));
      return;
    }
  }
  submissions = [...submissions, row];
  render();
}

async function awardPoints(hunt, submissionId, points) {
  const existing = awards.find((a) => a.submission_id === submissionId);
  if (existing) {
    const prev = { ...existing };
    existing.points_awarded = points;
    render();
    try {
      const { changed } = await db("UPDATE app_scavenger_hunt__awards SET points_awarded=? WHERE id=?", [points, existing.id]);
      if (changed === 0) throw userError("Those points could not be changed.");
    }
    catch (e) { console.error(e); Object.assign(existing, prev); showError(failureLine(e, { action: "save the points", thing: "award" })); }
    return;
  }
  const row = { id: crypto.randomUUID(), hunt_id: hunt.id, submission_id: submissionId, points_awarded: points, awarded_by: me.id, created_at: nowIso() };
  awards = [...awards, row];
  render();
  try {
    await db("INSERT INTO app_scavenger_hunt__awards (id, hunt_id, submission_id, points_awarded, awarded_by, created_at) VALUES (?,?,?,?,?,?)",
      [row.id, row.hunt_id, row.submission_id, row.points_awarded, row.awarded_by, row.created_at]);
  } catch (e) { console.error(e); awards = awards.filter((a) => a.id !== row.id); showError(failureLine(e, { action: "save the points", thing: "award" })); }
}

/* ── Rendering ─────────────────────────────────────────────────────────────── */
// Points typed into an award box and not yet awarded, by submission id. Each
// award redraws the hunt, and a box drawn from stored values alone put every
// other typed number back (a typed 0 became the task's default).
const awardDrafts = new Map();
const awarding = new Set();   // submission ids with an award write still out
document.addEventListener("input", (e) => {
  const id = e.target?.getAttribute?.("data-award-input");
  if (id) awardDrafts.set(id, e.target.value);
});

// The view is drawn whole, so put the caret back after typing.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const next = document.getElementById("search");

});

function renderFind(hunt, s, organizer) {
  const awardMap = awardBySubmission(awards, hunt.id);
  const award = awardMap.get(s.id);
  // The box starts at what the task is worth, so awarding is one tap. A number
  // already typed there outlives the redraws other awards cause (awardDrafts).
  const worth = Number(tasks.find((t) => t.id === s.task_id)?.points) || 1;
  const boxValue = awardDrafts.has(s.id) ? awardDrafts.get(s.id) : String(award ? Number(award.points_awarded) : worth);
  return `
    <div class="find" data-testid="find" data-submission-id="${esc(s.id)}" data-mine="${s.member_id === me?.id ? "yes" : "no"}">
      ${s.photo_file_id ? `<a href="${esc(files.url(s.photo_file_id))}" target="_blank" rel="noopener" aria-label="Open the full photo by ${esc(memberName(s.member_id))}"><img src="${esc(files.url(tilePhotoId(s)))}" alt="Find by ${esc(memberName(s.member_id))}" loading="lazy" /></a>` : ""}
      <div class="find-meta">
        <span class="who">${esc(memberName(s.member_id))}</span>
        ${s.caption ? ` — ${esc(s.caption)}` : ""}
        ${award ? `<div>${glyph("medal")} ${esc(String(Number(award.points_awarded)))} pts</div>` : ""}

          <div class="award-row">

}

function renderTask(hunt, task, organizer) {
  const mine = submissionFor(submissions, task.id, me?.id);
  const taskSubs = submissions.filter((s) => s.task_id === task.id);
  return `
    <div class="task-card" data-testid="task-card" data-task-id="${esc(task.id)}" data-mine="${mine ? "yes" : "no"}">
      <div class="task-points">${esc(String(Number(task.points) || 1))} pt${Number(task.points) === 1 ? "" : "s"}</div>
      <div class="task-title">${esc(task.title)}</div>
      ${organizer && hunt.status === "draft" ? `<div class="sealed"><button class="btn btn-ghost btn-sm" data-delete-task="${esc(task.id)}">Remove</button></div>` : ""}
      ${hunt.status === "open" ? (mine
        ? `<div class="sealed" data-testid="task-sealed">${glyph("lock")} Your find is in${mine.caption ? `: <strong>${esc(mine.caption)}</strong>` : ""}. Sealed until the reveal.</div>`
        : `
          <form class="submit-row" data-find-form="${esc(task.id)}">

        ? `<div class="sealed">Revealing the finds…</div>`
        : taskSubs.length
        ? `<div class="finds">${taskSubs.map((s) => renderFind(hunt, s, organizer)).join("")}</div>`

}

function renderHunt(hunt) {
  const organizer = isOrganizer(hunt, me);
  const ts = huntTasks(tasks, hunt.id);
  const myFinds = foundCount(submissions, tasks, hunt.id, me?.id);
  const scores = scoreboard(awards, submissions, hunt.id);
  return `
    <button class="back" data-back>← All hunts</button>
    <div class="topbar">
      <div>
        <h1>${esc(hunt.title)}</h1>
        <p class="muted tiny">${esc(statusLabel(hunt.status))} · by ${esc(memberName(hunt.created_by))}${hunt.status === "open" ? ` · you've found ${myFinds}/${ts.length}` : ""}</p>
      </div>
      ${organizer ? `
        <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end">
          ${hunt.status === "draft" ? `<button class="btn btn-sm" data-start-hunt>Start the hunt</button>` : ""}
          ${hunt.status === "open" ? `<button class="btn btn-sm" data-close-hunt>End & reveal</button>` : ""}
          ${hunt.status === "draft" ? `<button class="btn btn-ghost btn-sm" data-add-task>+ Thing to find</button>` : ""}
          ${hunt.status === "closed" && share.enabled && isAdult(me) ? `<button class="btn btn-ghost btn-sm" data-share>${glyph("link")} Share gallery</button>` : ""}
          <button class="btn btn-danger btn-sm" data-delete-hunt>Delete</button>
        </div>` : ""}
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${hunt.status === "closed" && scores.length ? `
      <div class="section-head"><h2>${glyph("trophy")} Scoreboard</h2></div>
      <div class="stack" data-testid="scoreboard" style="margin-bottom:14px">
        ${scores.map((s, i) => `
          <div class="score-row" data-testid="score-row" data-points="${esc(String(s.points))}">
            <span class="score-rank">${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}</span>
            <span class="score-name">${esc(memberName(s.member_id))}</span>
            <span class="score-pts">${s.points} pts · ${s.finds} finds</span>
          </div>`).join("")}
      </div>` : ""}
    ${ts.length
      ? `<div class="stack">${ts.map((t) => renderTask(hunt, t, organizer)).join("")}</div>`
      : `<div class="card empty tiny"><div>${chickadee(organizer ? "nest" : "waiting", { size: 72 })}</div>${organizer ? "Add things to find, then start the hunt." : "The organizer is still building the list."}</div>`}
  `;
}

function render() {
  const root = document.getElementById("root");
  root.className = "app-root";
  const hunt = openHuntId ? hunts.find((h) => h.id === openHuntId) : null;
  // The view is drawn whole, and a find form holds things a redraw cannot put
  // back: a chosen photo, a half-typed caption, a "Sealing…" in progress. One
  // find landing redrew every other form empty, and a photo being taken for
  // the next task arrived at an input no longer on the page. So the forms on
  // screen are carried over, as the same elements, wherever the new view still
  // has a form for that task.
  const kept = new Map();
  root.querySelectorAll("[data-find-form]").forEach((form) => kept.set(form.getAttribute("data-find-form"), form));
  const focused = document.activeElement;
  root.innerHTML = hunt ? renderHunt(hunt) : renderHuntList();
  root.querySelectorAll("[data-find-form]").forEach((form) => {
    const carried = kept.get(form.getAttribute("data-find-form"));
    if (carried) {
      form.replaceWith(carried);
      if (focused && carried.contains(focused)) focused.focus();
      return;
    }
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const taskId = form.getAttribute("data-find-form");
      const file = form.querySelector('input[type="file"]')?.files?.[0] ?? null;
      const caption = form.querySelector('input[type="text"]').value.trim();
      if (!file && !caption) { hubAlert("Add a photo or a caption so there's some proof!"); return; }
      const btn = form.querySelector("button");
      if (btn?.disabled) return;
      error = "";
      if (btn) { btn.disabled = true; btn.textContent = "Sealing…"; }
      // Re-armed either way: a find that landed takes its form off the page,
      // and one that did not keeps this form, photo and caption included, and
      // needs its button back.
      submitFind(hunt, taskId, file, caption)
        .catch((err) => { console.error(err); showError(failureLine(err, { action: "send your find", thing: "find" })); })
        .finally(() => { if (btn) { btn.disabled = false; btn.textContent = "Submit find"; } });
    });
  });
}

/* ── Modals ────────────────────────────────────────────────────────────────── */
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }

// Sends a modal form's save. The form stays open, as typed, until the save
// lands; one that fails is said in the form's own error line and the button
// comes back to send it again.
function submitModalForm(form, busyLabel, save) {
  const btn = form.querySelector('button[type="submit"]');
  const note = form.querySelector("[data-form-error]");
  if (btn?.disabled) return;
  const label = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = busyLabel; }
  if (note) note.hidden = true;
  save()
    .catch((err) => { console.error(err); if (note) { note.textContent = failureLine(err, { action: "save", thing: "entry" }); note.hidden = false; } })
    .finally(() => { if (btn) { btn.disabled = false; btn.textContent = label; } });
}

/* ── Share gallery ─────────────────────────────────────────────────────────── */
// A finished hunt's photos on a public, account-free URL. Offered only once the
// hunt is closed: `shareable.hunt.visible_where` gates the page on status
// "closed", so a link minted earlier would render nothing anyway — and the
// reveal is the whole point of the game.
//
// Deliberately unattributed. `submissions` carries member_id but no display
// name, and the feed reads one table, so no name reaches the page — which is
// the right default for a link that publishes photos of children.
// `created` is the link a create just returned. It is drawn from that reply
// when the list read does not carry it (refused, or behind), so a live public
// address is never left off the screen.
async function openShareModal(hunt, created = null) {
  const status = await share.listAll();
  shareLinks = status.links;
  if (created && !shareLinks.some((l) => l.id === created.id)) {
    shareLinks = [{ id: created.id, url: created.url, itemId: hunt.id, expiresAt: created.expiresAt, revokedAt: null, viewCount: 0, hasPassword: !!created.hasPassword }, ...shareLinks];
  }
  shareEntitled = status.entitled;
  const live = activeShareLinks(shareLinks, hunt.id);
  // A refused read comes back as an empty list; `limits` is the tell (the hub
  // sends it on every read it answers). "No links yet" there would invite a
  // second link beside one that could not be listed.
  const refused = status.limits === null && !created;

  const rows = live.map((l) => `
    <div class="share-row">
      <input readonly value="${esc(l.url)}" onclick="this.select()" class="share-url" />
      <div class="muted tiny">
        Expires ${new Date(l.expiresAt).toLocaleDateString()} · ${l.viewCount} view${l.viewCount === 1 ? "" : "s"}${l.hasPassword ? ` · ${glyph("lock")} password` : ""}
      </div>
      <div class="share-row-actions">
        <button class="btn btn-ghost btn-sm" data-share-copy="${esc(l.id)}">Copy</button>
        <button class="btn btn-danger btn-sm" data-share-revoke="${esc(l.id)}">Revoke</button>
      </div>
    </div>`).join("");

  openModal(`
    <h2>Share "${esc(hunt.title)}"</h2>
    <p class="muted tiny">
      Anyone with the link sees the finished hunt's list, with points, and its photos and captions — no account, no names.
      Links expire on their own, and revoking one cuts off the photos immediately.
    </p>
    ${refused
      ? `<p class="error" data-testid="share-refused">Sharing isn't available here right now. In a shared space only stewards can create links unless a steward opens it up, and a household can switch sharing off entirely.</p>`
      : rows || `<p class="muted tiny">No active links yet.</p>`}
    ${shareEntitled ? `
      <input id="share-password" type="text" autocomplete="off" placeholder="Optional password (${MIN_SHARE_PASSWORD}+ characters)" />` : ""}
    <div class="share-create">
      ${refused ? "" : `<select id="share-expiry">
        ${SHARE_EXPIRY_CHOICES.map(({ hours, label }) =>
              `<option value="${hours}"${hours === DEFAULT_SHARE_EXPIRY_HOURS ? " selected" : ""}>${label}</option>`).join("")}
        ${shareEntitled ? `<option value="8760">1 year</option>` : ""}
      </select>
      <button class="btn" data-share-create>Create link</button>`}
      <button class="btn btn-ghost" data-cancel>Close</button>
    </div>
  `);
}

// The hub's own minimum (share-links.ts MIN_PASSWORD_LENGTH), checked here so
// the organizer reads why instead of the hub's generic refusal.
const MIN_SHARE_PASSWORD = 6;

async function createShareLink(hunt) {
  const hours = Number(document.getElementById("share-expiry")?.value) || undefined;
  const password = document.getElementById("share-password")?.value?.trim() || undefined;
  if (password && password.length < MIN_SHARE_PASSWORD) {
    hubAlert(`A password needs at least ${MIN_SHARE_PASSWORD} characters.`, { description: "Make it longer, or clear it for a link with no password." });
    return;
  }
  const btn = document.querySelector("[data-share-create]");
  if (btn) { btn.disabled = true; btn.textContent = "Creating…"; }
  let link;
  try {
    link = await share.create("hunt", hunt.id, { expiresInHours: hours, label: hunt.title, password });
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "Create link"; }
    console.error(err);
    hubAlert("Couldn’t create the share link — try again.");
    return;
  }
  try { await navigator.clipboard.writeText(link.url); } catch { /* the re-render shows the url to copy */ }
  // The link exists from here on. A list that will not refresh is said as
  // that, with the address, so nobody mints a second public link to see one.
  try {
    await openShareModal(hunt, link);
  } catch {
    closeModal();
    hubAlert("Link created", { description: `The list of links could not refresh, so here it is: ${link.url}` });
  }
}

async function revokeShareLink(id, hunt) {
  const ok = await hubConfirm("Revoke this link?", {
    description: "Anyone using it loses the gallery straight away, photos included.",
    confirmLabel: "Revoke",
  });
  if (!ok) return;
  try { await share.revoke(id); await openShareModal(hunt); }
  catch (err) { console.error(err); hubAlert("Couldn’t revoke the share link — try again."); }
}

/* ── Events ────────────────────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  // A message is about the action that raised it; the next one starts clean.
  error = "";
  const hunt = openHuntId ? hunts.find((h) => h.id === openHuntId) : null;
  if (t.dataset.testid === "load-retry") { refresh(); return; }
  if (t.hasAttribute("data-open")) { openHuntId = t.getAttribute("data-open"); render(); return; }
  if (t.hasAttribute("data-back")) { openHuntId = null; render(); return; }
  if (t.hasAttribute("data-cancel")) { closeModal(); return; }
  if (t.hasAttribute("data-new-hunt")) { openHuntEditor(); return; }
  if (!hunt) return;
  if (t.hasAttribute("data-add-task")) { openTaskEditor(hunt.id); return; }
  if (t.hasAttribute("data-delete-task")) { deleteTask(t.getAttribute("data-delete-task")).catch((err) => { console.error(err); showError(failureLine(err, { action: "remove the task", thing: "task" })); }); return; }
  if (t.hasAttribute("data-start-hunt")) {
    if (!huntTasks(tasks, hunt.id).length) { hubAlert("Add at least one thing to find first."); return; }
    setHuntStatus(hunt.id, "open").catch((err) => { console.error(err); showError(failureLine(err, { action: "start the hunt", thing: "hunt" })); });
    return;
  }
  if (t.hasAttribute("data-close-hunt")) { closeHunt(hunt.id).catch((err) => { console.error(err); showError(failureLine(err, { action: "close the hunt", thing: "hunt" })); }); return; }
  if (t.hasAttribute("data-delete-hunt")) { deleteHunt(hunt.id); return; }
  if (t.hasAttribute("data-share")) { openShareModal(hunt).catch((err) => { console.error(err); showError("Couldn’t load the share links."); }); return; }
  if (t.hasAttribute("data-share-create")) { createShareLink(hunt); return; }
  if (t.hasAttribute("data-share-revoke")) { revokeShareLink(t.getAttribute("data-share-revoke"), hunt); return; }
  if (t.hasAttribute("data-share-copy")) {
    const link = shareLinks.find((l) => l.id === t.getAttribute("data-share-copy"));
    if (link) navigator.clipboard.writeText(link.url).catch(() => hubAlert("Couldn't copy — select the link text and copy it manually."));
    return;
  }
  if (t.hasAttribute("data-award")) {
    const sid = t.getAttribute("data-award");
    const input = document.querySelector(`input[data-award-input="${CSS.escape(sid)}"]`);
    // One award per find at a time: a second tap sent an UPDATE that could
    // overtake the INSERT it was changing, and was lost without a word.
    if (awarding.has(sid)) return;
    const pts = Math.max(0, Math.min(99, Number(input?.value) || 0));
    awardDrafts.delete(sid);
    awarding.add(sid);
    awardPoints(hunt, sid, pts).finally(() => awarding.delete(sid)).catch((err) => { console.error(err); showError(failureLine(err, { action: "save the points", thing: "award" })); });
  }
});

refresh();
</script>
</body>
</html>
